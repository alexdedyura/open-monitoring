# Builds the single-file Windows executable. Default-branch pushes update the
# rolling "latest" prerelease; semver tags publish the stable release consumed
# by the in-app updater.
#
# The build mirrors a local `.\build.ps1` run: publish the C# sensor bridge,
# fetch PresentMon, stage both into internal/sidecar/bin, then `wails build`.
name: release

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write # create/update the release and upload the asset

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Only internal/ — vetting the main package would need frontend/dist,
      # which is not built until the packaging step below.
      - name: Vet and test
        shell: bash
        run: go vet ./internal/... && go test -short ./internal/...

      # Keep the generator/packager on exactly the same version as the runtime
      # in go.mod. A Dependabot bump must never leave CI silently packaging a
      # newer runtime with an older CLI.
      - name: Install matching Wails CLI
        shell: pwsh
        run: |
          $version = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          if (-not $version) { throw 'Could not resolve the Wails version from go.mod' }
          go install "github.com/wailsapp/wails/v2/cmd/wails@$version"
          if ($LASTEXITCODE -ne 0) { throw "Could not install Wails CLI $version" }

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $productVersion = (Get-Content wails.json -Raw | ConvertFrom-Json).info.productVersion
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          if ($productVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match wails.json version $productVersion"
          }

      # NSIS is preinstalled on the Windows runner images but not on PATH;
      # fall back to Chocolatey if a future image drops it.
      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $candidates = "${env:ProgramFiles(x86)}\NSIS\Bin", "${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS\Bin", "$env:ProgramFiles\NSIS"
          $dir = $candidates | Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } | Select-Object -First 1
          if (-not $dir) {
            choco install nsis -y --no-progress
            $dir = $candidates | Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } | Select-Object -First 1
          }
          if (-not $dir) { throw 'makensis not found' }
          Add-Content $env:GITHUB_PATH $dir

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Installer

      # A release tag is a real source pointer, not just a bucket for mutable
      # assets. Move the rolling tag with the rolling binaries so its source
      # archive and commit link cannot stay months behind the downloads.
      - name: Move rolling tag to this commit
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Publish rolling build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: false
          body: |
            Automated build of `${{ github.sha }}`.

            This is a continuously updated preview. For the supported release,
            use the newest versioned `vX.Y.Z` release.

            - `open-monitoring-amd64-installer.exe` — installer: Start-menu shortcut,
              uninstaller, and the required PawnIO driver (selected by default).
            - `open-monitoring.exe` — portable single file, nothing to install;
              the PawnIO driver is offered on first launch.
          files: |
            build/bin/open-monitoring.exe
            build/bin/open-monitoring-amd64-installer.exe

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Open Monitoring ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            build/bin/open-monitoring.exe
            build/bin/open-monitoring-amd64-installer.exe
