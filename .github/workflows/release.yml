# Builds the single-file Windows executable and publishes it to the rolling
# "latest" GitHub Release on every push to the default branch.
#
# The build mirrors a local `.\build.ps1` run: publish the C# sensor bridge,
# fetch PresentMon, stage both into internal/sidecar/bin, then `wails build`.
name: release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # create/update the release and upload the asset

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # NSIS is preinstalled on the Windows runner images but not on PATH;
      # fall back to Chocolatey if a future image drops it.
      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $candidates = "${env:ProgramFiles(x86)}\NSIS\Bin", "${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS\Bin", "$env:ProgramFiles\NSIS"
          $dir = $candidates | Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } | Select-Object -First 1
          if (-not $dir) {
            choco install nsis -y --no-progress
            $dir = $candidates | Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } | Select-Object -First 1
          }
          if (-not $dir) { throw 'makensis not found' }
          Add-Content $env:GITHUB_PATH $dir

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Installer

      - name: Publish to the rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automated build of `${{ github.sha }}`.

            - `open-monitoring-amd64-installer.exe` — installer: Start-menu shortcut,
              uninstaller, and the required PawnIO driver (selected by default).
            - `open-monitoring.exe` — portable single file, nothing to install;
              the PawnIO driver is offered on first launch.
          files: |
            build/bin/open-monitoring.exe
            build/bin/open-monitoring-amd64-installer.exe
